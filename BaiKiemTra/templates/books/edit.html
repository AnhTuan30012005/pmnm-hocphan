{% extends "base.html" %}

{% block title %}Chỉnh Sửa Sách · {{ book.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card p-4">
            <div class="text-center mb-4">
                <div class="p-3 bg-warning-subtle rounded-circle d-inline-block text-warning mb-2">
                    <i class="bi bi-pencil-square fs-2"></i>
                </div>
                <h3 class="fw-bold text-dark">Chỉnh Sửa Thông Tin Sách</h3>
                <p class="text-muted small">Cập nhật dữ liệu cuốn sách <strong>#{{ book.id }} - {{ book.title }}</strong></p>
            </div>

            <form method="POST">
                <div class="row g-3">
                    <!-- Tên sách -->
                    <div class="col-12">
                        <label for="title" class="form-label fw-semibold">Tên Cuốn Sách <span class="text-danger">*</span></label>
                        <input type="text" class="form-control form-control-lg" id="title" name="title" value="{{ book.title }}" required maxlength="200">
                    </div>

                    <!-- Tác giả -->
                    <div class="col-md-6">
                        <label for="author" class="form-label fw-semibold">Tác Giả <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="author" name="author" value="{{ book.author }}" required maxlength="100">
                    </div>

                    <!-- Danh mục -->
                    <div class="col-md-6">
                        <label for="category_id" class="form-label fw-semibold">Thuộc Danh Mục <span class="text-danger">*</span></label>
                        <select class="form-select" id="category_id" name="category_id" required>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}" {% if book.category_id == cat.id %}selected{% endif %}>
                                {{ cat.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Năm xuất bản -->
                    <div class="col-md-4">
                        <label for="year" class="form-label fw-semibold">Năm Xuất Bản</label>
                        <input type="number" class="form-control" id="year" name="year" min="1900" max="2099" value="{{ book.year }}">
                    </div>

                    <!-- Đơn giá -->
                    <div class="col-md-4">
                        <label for="price" class="form-label fw-semibold">Đơn Giá (VNĐ)</label>
                        <input type="number" step="1000" class="form-control" id="price" name="price" value="{{ book.price | int }}">
                    </div>

                    <!-- Số lượng -->
                    <div class="col-md-4">
                        <label for="quantity" class="form-label fw-semibold">Số Lượng Kho</label>
                        <input type="number" min="0" class="form-control" id="quantity" name="quantity" value="{{ book.quantity }}">
                    </div>

                    <!-- Trạng thái sẵn sàng -->
                    <div class="col-12 mt-3">
                        <div class="form-check form-switch p-3 bg-light rounded">
                            <input class="form-check-input ms-0 me-3" type="checkbox" id="available" name="available" {% if book.available %}checked{% endif %}>
                            <label class="form-check-label fw-semibold" for="available">
                                Sẵn sàng cho bạn đọc mượn / xuất kho
                            </label>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4 pt-2 border-top">
                    <a href="{{ url_for('book_detail', id=book.id) }}" class="btn btn-outline-secondary w-50 py-2">
                        <i class="bi bi-arrow-left me-1"></i> Hủy Bỏ
                    </a>
                    <button type="submit" class="btn btn-warning text-dark w-50 py-2 shadow-sm">
                        <i class="bi bi-check-lg me-1"></i> Cập Nhật Sách
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
