{% extends "base.html" %}

{% block title %}Thêm Danh Mục Sách Mới{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card p-4">
            <div class="text-center mb-4">
                <div class="p-3 bg-primary-subtle rounded-circle d-inline-block text-primary mb-2">
                    <i class="bi bi-folder-plus fs-2"></i>
                </div>
                <h3 class="fw-bold text-dark">Thêm Danh Mục Sách</h3>
                <p class="text-muted small">Tạo phân loại sách mới để gom nhóm các đầu sách trong thư viện</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Tên Danh Mục <span class="text-danger">*</span></label>
                    <input type="text" class="form-control form-control-lg" id="name" name="name" placeholder="Ví dụ: Khoa học viễn tưởng, Lập trình..." value="{{ name or '' }}" required autofocus maxlength="100">
                    <div class="form-text">Tên danh mục là duy nhất và không được để trống.</div>
                </div>

                <div class="mb-4">
                    <label for="description" class="form-label fw-semibold">Mô Tả Danh Mục</label>
                    <textarea class="form-control" id="description" name="description" rows="3" placeholder="Mô tả tóm tắt về thể loại sách này...">{{ description or '' }}</textarea>
                </div>

                <div class="d-flex gap-2">
                    <a href="{{ url_for('list_categories') }}" class="btn btn-outline-secondary w-50 py-2">
                        <i class="bi bi-arrow-left me-1"></i> Quay lại
                    </a>
                    <button type="submit" class="btn btn-primary w-50 py-2 shadow-sm">
                        <i class="bi bi-check2-circle me-1"></i> Lưu Danh Mục
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
