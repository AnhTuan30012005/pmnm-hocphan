<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Chương 5 - Form & Dữ liệu{% endblock %}</title>

    <!-- Bootstrap 5 CSS & Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* NỀN ĐEN TỊT VŨ TRỤ (Deep Pure Black Space) */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: #000000;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        /* ĐỐM SÁNG LITI THIÊN HÀ LẤP LÁNH (Twinkling Pinpoint Stars) */
        .galaxy-stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(1.5px 1.5px at 15px 25px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 95px, #93c5fd, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 110px 45px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 180px 160px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 230px 60px, #e2e8f0, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 290px 190px, #bfdbfe, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 340px 110px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 390px 240px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 75px 230px, #a5b4fc, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 160px 280px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 380px 300px;
            pointer-events: none;
            z-index: 0;
            animation: twinkle 4s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.6; }
            50% { opacity: 0.95; }
            100% { opacity: 0.7; }
        }

        /* Định vị điện thoại ở giữa màn hình */
        .phone-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 12px;
        }

        /* KHUNG THÂN ĐIỆN THOẠI (Gọn gàng vừa vặn, kích thước 375px x 720px) */
        .phone-frame {
            width: 100%;
            max-width: 375px;
            height: 720px;
            background: #0b0f19;
            border-radius: 44px;
            border: 8px solid #1e293b;
            outline: 1.5px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 0 35px rgba(255, 255, 255, 0.08),
                0 0 80px rgba(99, 102, 241, 0.22),
                0 25px 70px rgba(0, 0, 0, 0.98);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
        }

        /* Dynamic Island */
        .dynamic-island {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 95px;
            height: 22px;
            background: #000000;
            border-radius: 18px;
            z-index: 100;
            box-shadow: 0 0 2px rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
        }
        .dynamic-island-lens {
            width: 8px;
            height: 8px;
            background: #111827;
            border: 1.5px solid #1f2937;
            border-radius: 50%;
        }

        /* Màn hình điện thoại */
        .phone-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #070a12 0%, #0d121f 100%);
            overflow: hidden;
            padding-top: 36px;
        }

        /* Topbar điện thoại */
        .phone-topbar {
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(13, 18, 31, 0.85);
            backdrop-filter: blur(10px);
        }
        .app-title {
            font-size: 0.86rem;
            font-weight: 700;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Vùng nội dung cuộn bên trong điện thoại */
        .phone-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 20px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
        }

        /* Bottom Nav điện thoại */
        .phone-bottom-nav {
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            padding: 6px 4px 10px;
            z-index: 90;
        }

        .phone-bottom-nav .nav-link-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        .phone-bottom-nav .nav-link-btn i {
            font-size: 1.15rem;
        }
        .phone-bottom-nav .nav-link-btn:hover {
            color: #93c5fd;
        }
        .phone-bottom-nav .nav-link-btn.active {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
        }

        /* Card container */
        .phone-card {
            background: rgba(22, 30, 46, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px 14px;
            backdrop-filter: blur(10px);
            margin-bottom: 14px;
        }

        .form-group {
            margin-bottom: 14px;
        }
        label {
            font-size: 0.84rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 5px;
            display: block;
        }

        .form-control, .form-select {
            background-color: rgba(11, 15, 25, 0.85) !important;
            border: 1px solid rgba(255, 255, 255, 0.14) !important;
            color: #f8fafc !important;
            border-radius: 9px !important;
            padding: 8px 11px !important;
            font-size: 0.9rem !important;
            transition: all 0.2s ease !important;
        }
        .form-control:focus, .form-select:focus {
            background-color: rgba(11, 15, 25, 0.98) !important;
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25) !important;
            color: #ffffff !important;
        }
        .form-control::placeholder {
            color: #64748b !important;
            font-size: 0.82rem !important;
        }

        /* Báo lỗi */
        .input-error {
            border-color: #ef4444 !important;
            background-color: rgba(239, 68, 68, 0.12) !important;
        }
        .error-text {
            color: #f87171;
            font-size: 0.8rem;
            margin-top: 4px;
            font-weight: 500;
        }

        /* Nút tính toán */
        .btn-calc {
            background: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
            border: none;
            color: #ffffff;
            font-weight: 600;
            padding: 10px;
            border-radius: 11px;
            width: 100%;
            font-size: 0.92rem;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
            transition: all 0.2s ease;
        }
        .btn-calc:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.55);
            color: #ffffff;
        }

        /* Hộp kết quả */
        .result-box {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 11px;
            font-size: 0.98rem;
            font-weight: 700;
            backdrop-filter: blur(8px);
        }
        .result-box, .result-box.result-green {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
        }
        .result-box.result-yellow {
            background: rgba(234, 179, 8, 0.15);
            border: 1px solid rgba(234, 179, 8, 0.4);
            color: #facc15;
        }
        .result-box.result-red {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
        }

        /* RESPONSIVE TRÊN ĐIỆN THOẠI VÀ LAPTOP */
        @media (max-width: 480px) {
            .phone-wrapper {
                padding: 0;
            }
            .phone-frame {
                max-width: 100%;
                height: 100vh;
                border-radius: 0;
                border: none;
                outline: none;
                box-shadow: none;
            }
            .dynamic-island {
                display: none;
            }
            .phone-screen {
                padding-top: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Đốm sáng liti thiên hà lấp lánh trên nền đen tịt -->
    <div class="galaxy-stars"></div>

    <!-- Bao quanh khung điện thoại ở giữa -->
    <div class="phone-wrapper">
        <div class="phone-frame">
            
            <!-- Dynamic Island trên đầu điện thoại -->
            <div class="dynamic-island">
                <div class="dynamic-island-lens"></div>
            </div>

            <!-- Màn hình điện thoại -->
            <div class="phone-screen">
                
                <!-- Thanh Topbar điện thoại -->
                <div class="phone-topbar">
                    <div class="app-title">
                        <i class="bi bi-stars text-primary"></i>
                        <span>PMNM · Buổi 7</span>
                    </div>
                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle" style="font-size: 0.68rem;">
                        Chương 5
                    </span>
                </div>

                <!-- Vùng hiển thị nội dung từng bài -->
                <div class="phone-content">
                    {% block content %}{% endblock %}
                </div>

                <!-- Thanh Menu dưới đáy (Bottom Navigation) -->
                <nav class="phone-bottom-nav">
                    <a href="{{ url_for('home') }}" class="nav-link-btn {% if request.endpoint == 'home' %}active{% endif %}">
                        <i class="bi bi-house-door-fill"></i>
                        <span>Home</span>
                    </a>
                    <a href="{{ url_for('bai1') }}" class="nav-link-btn {% if request.endpoint == 'bai1' %}active{% endif %}">
                        <i class="bi bi-calculator-fill"></i>
                        <span>Bài 1</span>
                    </a>
                    <a href="{{ url_for('bai2') }}" class="nav-link-btn {% if request.endpoint == 'bai2' %}active{% endif %}">
                        <i class="bi bi-mortarboard-fill"></i>
                        <span>Bài 2</span>
                    </a>
                    <a href="{{ url_for('bai3') }}" class="nav-link-btn {% if request.endpoint == 'bai3' %}active{% endif %}">
                        <i class="bi bi-heart-pulse-fill"></i>
                        <span>Bài 3</span>
                    </a>
                </nav>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
