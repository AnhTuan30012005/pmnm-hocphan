{% extends "base.html" %}

{% block title %}Sửa Sinh viên {{ student.mssv }} · Chương 6{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4">
            <h3 class="fw-bold text-center mb-3 text-primary">
                <i class="bi bi-pencil-square me-2"></i>Sửa Thông Tin Sinh viên
            </h3>
            <p class="text-muted text-center mb-4">Cập nhật họ tên hoặc điểm GPA của sinh viên</p>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Mã số sinh viên (MSSV)</label>
                    <input type="text" class="form-control bg-light" value="{{ student.mssv }}" readonly disabled>
                    <div class="form-text">MSSV là trường khoá duy nhất, không thể thay đổi.</div>
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ student.name }}" required maxlength="100">
                </div>

                <div class="mb-4">
                    <label for="gpa" class="form-label fw-semibold">Điểm GPA</label>
                    <input type="number" step="0.01" min="0" max="10" class="form-control" id="gpa" name="gpa" value="{{ student.gpa }}">
                </div>

                <div class="d-flex gap-2">
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary w-50">
                        <i class="bi bi-arrow-left me-1"></i> Quay lại
                    </a>
                    <button type="submit" class="btn btn-primary w-50">
                        <i class="bi bi-check-lg me-1"></i> Cập nhật
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
