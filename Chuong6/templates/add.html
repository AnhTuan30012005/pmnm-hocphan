{% extends "base.html" %}

{% block title %}Thêm Sinh viên mới · Chương 6{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4">
            <h3 class="fw-bold text-center mb-3 text-primary">
                <i class="bi bi-person-plus-fill me-2"></i>Thêm Sinh viên
            </h3>
            <p class="text-muted text-center mb-4">Nhập thông tin sinh viên để lưu vào bảng <code>student</code></p>

            <form method="POST">
                <div class="mb-3">
                    <label for="mssv" class="form-label fw-semibold">Mã số sinh viên (MSSV) <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="mssv" name="mssv" placeholder="Ví dụ: 23T1020001" value="{{ mssv or '' }}" required maxlength="10">
                    <div class="form-text">MSSV là duy nhất (UNIQUE) và tối đa 10 ký tự.</div>
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="Ví dụ: Nguyễn Văn An" value="{{ name or '' }}" required maxlength="100">
                </div>

                <div class="mb-4">
                    <label for="gpa" class="form-label fw-semibold">Điểm GPA</label>
                    <input type="number" step="0.01" min="0" max="10" class="form-control" id="gpa" name="gpa" placeholder="0.0" value="{{ gpa or '' }}">
                    <div class="form-text">Mặc định là 0.0 nếu để trống.</div>
                </div>

                <div class="d-flex gap-2">
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary w-50">
                        <i class="bi bi-arrow-left me-1"></i> Quay lại
                    </a>
                    <button type="submit" class="btn btn-primary w-50">
                        <i class="bi bi-check2-circle me-1"></i> Lưu Sinh viên
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
